<section class="bid-list">
  @for (bid of filteredBids(); track bid.idBid) {
    <article
      class="bid-card"
      (click)="modal.openBidDetails(bid)"
      (keydown.enter)="modal.openBidDetails(bid)"
      tabindex="0"
      role="button"
    >
      <div class="bid-image">
        <img [src]="bidPhotoSrc(bid)" (error)="onImgError($event)" alt="Photo de l'annonce" loading="lazy">
      </div>
      <div class="bid-content">
        <h3 class="bid-title">{{ bid.title }}</h3>
        @if (bid.location) {
          <p class="bid-location">{{ bid.location }}</p>
        }
        <p class="bid-price">{{ bid.price !== null ? (bid.price + ' XPF') : '-' }}</p>
      </div>
    </article>
  } @empty {
    <p class="bid-empty">
      {{ search.query().trim() ? 'Aucune annonce ne correspond a votre recherche.' : 'Aucune annonce pour le moment.' }}
    </p>
  }
</section>
