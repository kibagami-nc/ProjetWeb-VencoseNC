# =========================================================
# Changeset 002 : donnees de depart (jeu d'essai).
#
# Precondition : si la table "roles" contient deja des
# donnees (base existante), le changeset est saute (MARK_RAN).
#
# Les INSERT restent en SQL (bloc "sql") : c'est le format
# le plus lisible pour un jeu de donnees de cette taille.
# =========================================================
databaseChangeLog:
