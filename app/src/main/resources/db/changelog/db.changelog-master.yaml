# =========================================================
# Changelog principal de Liquibase.
#
# Chaque fichier inclus ci-dessous est un "changeset" : une
# migration executee UNE SEULE fois par base (Liquibase note
# ce qui a deja ete joue dans la table DATABASECHANGELOG).
#
# Pour faire evoluer le schema : ajouter un nouveau fichier
# 004-xxx.yaml dans changes/ et l'inclure ici A LA FIN.
# Ne JAMAIS modifier un changeset deja applique.
# =========================================================
databaseChangeLog:
  - include:
      file: db/changelog/changes/001-create-tables.yaml
  - include:
      file: db/changelog/changes/002-seed-data.yaml
  - include:
      file: db/changelog/changes/003-create-views.yaml
