#Database:
spring.datasource.url=jdbc:postgresql://localhost:5432/vencosenc
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA : Hibernate ne modifie jamais le schema, c'est Liquibase qui en est responsable
spring.jpa.hibernate.ddl-auto=none

#Liquibase : joue les migrations de db/changelog/ au demarrage de l'application
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

#Uploads : dossier de stockage des photos d'annonces.
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=65MB

#CORS : origine du front. En prod, surcharger via APP_CORS_ALLOWED_ORIGINS
app.cors-allowed-origins=http://localhost:4200
